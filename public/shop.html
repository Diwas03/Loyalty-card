<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scan to join · Loyalty</title>
    <link rel="icon" type="image/svg+xml" href="/brand.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/shop.js" defer></script>
  </head>
  <body class="customer-page poster-page">
    <main><header class="poster">
      <p id="shop-name" class="eyebrow">COFFEE LOYALTY</p>
      <h1>Your coffee ritual.<br /><em>Now with rewards.</em></h1>
      <p>Scan. Join. Collect coffee stamps.</p>
      <img
        id="qr"
        alt="Scan to create your own coffee membership"
        width="360"
        hidden
      />
      <p id="message" role="status"></p>
      <a id="join-link" hidden>Join the coffee club</a>
      <p>
        Save the loyalty app to your home screen, then show your card’s QR at the
        counter.
      </p>
      <small
        >No SMS registration or payment required. Works in your phone’s browser.</small
      ><button id="print" class="no-print">Print shop QR</button>
    </header>
    </main>
  </body>
</html>
