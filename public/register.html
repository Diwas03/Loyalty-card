<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create your shop owner account</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/register.js" defer></script>
  </head>
  <body class="login-page">
    <h1>Create your shop owner account</h1>
    <section>
      <p>Set up the shop’s first account. If your shop already has an owner, ask them to create your staff account.</p>
      <form id="register">
        <label>Your name <input name="fullName" autocomplete="name" maxlength="80" required /></label>
        <label>Choose a username <input name="username" autocomplete="username" pattern="[A-Za-z0-9._-]{3,40}" minlength="3" maxlength="40" required /></label>
        <label>Choose a password <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required /></label>
        <label>Confirm password <input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required /></label>
        <label>Shop setup password <input name="setupPassword" type="password" autocomplete="off" maxlength="200" required /></label>
        <small>Use the shop password you originally configured. This protects the first owner account.</small>
        <button>Create account</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <a href="/login.html">Already have an account? Sign in</a>
  </body>
</html>
